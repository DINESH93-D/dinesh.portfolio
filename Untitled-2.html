<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dinesh Kumar V – Front End Developer, Video Editor, Digital Marketer</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;600&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ===== COLOURS & FONTS: change these to restyle the whole site ===== */
:root{
  --bg:#141B2D;--panel:#1C2540;--line:#2F3B60;--text:#EDF1FC;--mute:#9BA7C9;
  --k:#4D8BFF;--s:#FFD479;--f:#FF8FB1;--n:#8DE3C0;
  --head:'Space Grotesk','Arial Narrow',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,monospace;--body:'Instrument Sans',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#F5F7FC;--panel:#FFFFFF;--line:#D3DAEC;--text:#141B2D;--mute:#4F5A7C;--k:#1D5FD1;--s:#946400;--f:#C2285F;--n:#0B7A55}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 var(--body)}
a{color:inherit}
:focus-visible{outline:3px solid var(--s);outline-offset:3px}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font:700 20px var(--head);text-decoration:none}
nav{display:flex;align-items:center;gap:22px}
nav a{text-decoration:none;color:var(--mute)}
nav a:hover{color:var(--text)}
#theme{background:none;border:1px solid var(--line);color:var(--text);border-radius:6px;padding:5px 12px;font:600 13px var(--body);cursor:pointer}
.hero{display:grid;grid-template-columns:1fr 1.1fr;gap:40px;align-items:center;padding:40px 0 0}
.photo{width:96px;height:96px;border-radius:50%;object-fit:cover;border:2px solid var(--k);margin-bottom:20px}
h1{font:700 clamp(2.3rem,5.6vw,4.5rem)/1.02 var(--head);letter-spacing:-.03em;margin:0 0 18px}
.lede{color:var(--mute);max-width:46ch;margin:0 0 28px}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:600 15px var(--body);background:var(--k);color:#07101F;border-radius:6px;padding:11px 20px;text-decoration:none;border:1px solid var(--k);transition:transform .2s;cursor:pointer}
.btn:hover{transform:translateY(-2px)}
.btn.alt{background:transparent;color:var(--text);border-color:var(--line)}
.win{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{display:flex;align-items:center;gap:7px;padding:10px 14px;border-bottom:1px solid var(--line);font:400 12px var(--mono);color:var(--mute)}
.bar i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.bar span{margin-left:8px}
pre{margin:0;padding:18px;font:400 14px/1.7 var(--mono);min-height:340px;overflow-x:auto;white-space:pre}
.k{color:var(--k)}.s{color:var(--s)}.f{color:var(--f)}.n{color:var(--n)}.m{color:var(--mute)}
.cur{display:inline-block;width:8px;height:1.1em;background:var(--s);vertical-align:text-bottom;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
section{padding:96px 0 0}
h2{font:700 clamp(1.8rem,4vw,2.6rem)/1.05 var(--head);letter-spacing:-.02em;margin:0 0 28px}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:32px}
.svc div{border-top:2px solid var(--k);padding-top:16px}
.svc h3{margin:0 0 8px;font:700 1.25rem var(--head)}
.svc p{margin:0;color:var(--mute)}
.proj{border-top:1px solid var(--line)}
.proj:last-child{border-bottom:1px solid var(--line)}
.proj button{all:unset;box-sizing:border-box;width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:22px 0;cursor:pointer}
.proj button:focus-visible{outline:3px solid var(--s);outline-offset:2px}
.proj h3{margin:0;font:700 1.35rem var(--head)}
.proj .yr{font:400 13px var(--mono);color:var(--mute)}
.plus{width:28px;height:28px;position:relative;flex:none}
.plus::before,.plus::after{content:"";position:absolute;left:6px;right:6px;top:13px;height:2px;background:var(--text);transition:transform .3s}
.plus::after{transform:rotate(90deg)}
.proj[data-open="true"] .plus::after{transform:rotate(0)}
.more{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
.proj[data-open="true"] .more{grid-template-rows:1fr}
.more>div{overflow:hidden}
.more p{margin:0 0 14px;color:var(--mute);max-width:62ch}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tags span{font:400 12px var(--mono);border:1px solid var(--line);border-radius:4px;padding:3px 9px;color:var(--n)}
.links{padding-bottom:24px}.links:empty{padding:0}
.links a{margin-right:18px;color:var(--k)}
.edu{display:grid;grid-template-columns:2fr 1fr;gap:6px 24px;padding:18px 0;border-top:1px solid var(--line)}
.edu:last-of-type{border-bottom:1px solid var(--line)}
.edu h3{margin:0;font:700 1.15rem var(--head)}
.edu p{margin:0;color:var(--mute)}
.edu .when{font:400 13px var(--mono);color:var(--mute);text-align:right}
.skills{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px}
.skills h3{font:700 1.05rem var(--head);margin:0 0 10px;color:var(--f)}
.skills ul{list-style:none;margin:0;padding:0;font:400 14px/2 var(--mono);color:var(--mute)}
.mq{overflow:hidden;margin-top:56px;border-block:1px solid var(--line);padding:14px 0;mask:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.mq div{display:flex;gap:40px;width:max-content;animation:slide 30s linear infinite;font:400 15px var(--mono);color:var(--mute)}
@keyframes slide{to{transform:translateX(-50%)}}
.mail{font:700 clamp(1.3rem,4.4vw,3rem)/1.1 var(--head);letter-spacing:-.02em;text-decoration:none;word-break:break-word;border-bottom:3px solid var(--k)}
.loc{color:var(--mute);margin:16px 0 0}
footer{color:var(--mute);padding:64px 0 40px;font-size:.9rem}
@media(max-width:800px){.hero{grid-template-columns:1fr}pre{font-size:12.5px}nav{gap:14px}.edu{grid-template-columns:1fr}.edu .when{text-align:left}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="#top" id="logo"></a>
<nav><a href="#work">Work</a><a href="#projects">Projects</a><a href="#skills">Skills</a><a href="#contact">Contact</a><button id="theme" aria-label="Switch light or dark theme">Theme</button></nav></header>
<main id="top">
<div class="hero">
  <div>
    <img class="photo" id="photo" alt="" hidden>
    <h1 id="headline"></h1>
    <p class="lede" id="tagline"></p>
    <div class="btns"><a class="btn" href="#projects">See projects</a><a class="btn alt" href="#contact">Get in touch</a></div>
  </div>
  <div class="win" role="img" aria-label="Code editor showing a profile object">
    <div class="bar"><i></i><i></i><i></i><span>dinesh.js</span></div>
    <pre id="code" aria-hidden="true"></pre>
  </div>
</div>
<section id="work"><h2>What I do</h2><div class="svc" id="svc"></div></section>
<section id="projects"><h2>Projects</h2><div id="plist"></div></section>
<section id="education"><h2>Education</h2><div id="edu"></div></section>
<section id="skills"><h2>Skills</h2><div class="skills" id="skills-grid"></div><div class="mq" aria-hidden="true"><div id="mq"></div></div></section>
<section id="contact"><h2 id="cta"></h2>
<a class="mail" id="mail"></a>
<p class="loc" id="loc"></p>
<div class="btns" style="margin-top:22px"><button class="btn alt" id="copy">Copy email</button><a class="btn alt" id="li">LinkedIn</a><a class="btn alt" id="gh" hidden>GitHub</a><a class="btn alt" id="ph" hidden>Call</a></div></section>
</main>
<footer id="foot"></footer>
</div>

<script>
/* =====================================================================
   EDIT THIS BLOCK: all text and links on the site live here.
   ===================================================================== */
const CONFIG = {
  name: "Dinesh Kumar V",
  role: "Front End Developer | Video Editor | Digital Marketer",
  headline: "I build responsive websites and edit videos that people finish watching.",
  tagline: "Creative fresher studying B.E. Mechanical Engineering, with hands-on skills in front end development, video production and digital marketing.",
  photo: "",
  openToWork: true,
  typedRoles: ["Front End Dev", "Video Editor", "Marketer"],
  typedStack: ["HTML5", "CSS3", "JavaScript", "Figma"],
  typedSkill: "responsive, polished work",
  contactHeading: "Let's work together.",
  email: "dineshhhhh.93s@gmail.com",
  location: "Coimbatore, Tamil Nadu",
  linkedin: "",
  github: "",
  phone: "6383349436",

  services: [
    { title: "Front end development", text: "Responsive, mobile-first websites built with HTML5, CSS3 and JavaScript, with the interface designed in Figma first." },
    { title: "Video editing and videography", text: "Shooting and cutting videos with clean pacing and sound, so the story holds attention." },
    { title: "Digital marketing" }
  ],

  projects: [
    { title: "Personal Portfolio Website", label: "Web",
      description: "Fully responsive personal portfolio with smooth animations, a mobile-first layout and project showcase sections. Deployed with GitHub Pages using version control.",
      tags: ["HTML5", "CSS3", "JavaScript"], code: "", demo: "" },
    { title: "Inventory Management System", label: "Java",
      description: "Console application built with Core Java and OOP principles. Add, update, delete and search products with real-time stock tracking, stored with the Java Collections Framework.",
      tags: ["Java", "OOP", "Collections"], code: "", demo: "" },
    { title: "Whiteboard Cleaning Machine", label: "Mechanical design",
      description: "Automated whiteboard cleaner designed as a mechanical engineering project. 3D models and assembly drawings in SolidWorks, with a motorised cleaning mechanism for even cleaning.",
      tags: ["SolidWorks", "Mechanical design"], code: "", demo: "" },
    { title: "Floor Cleaning Robotic Model", label: "Robotics",
      description: "Robot model that navigates and cleans floors on its own. Chassis designed in SolidWorks, and the prototype assembled with motorised wheels and a cleaning module.",
      tags: ["Robotics", "SolidWorks"], code: "", demo: "" }
  ],

  education: [
    { title: "B.E. Mechanical Engineering", place: "Dr. NGP Institute of Technology", period: "2024 – 2028" },
  ],

  skills: {
    "Technical": ["HTML5", "CSS3", "Figma (UI/UX)", "VS Code", "Python", "Java (basics)", "SolidWorks (basics)"],
    "Creative": ["Video editing", "Videography", "Digital marketing"],
    "Languages": ["Tamil (native)", "English (proficient)"],
    "Soft skills": ["Problem solving", "Teamwork", "Communication", "Time management"]
  },

  marquee: ["HTML5","CSS3","JavaScript","Figma","VS Code","Python","Java","SolidWorks","Video Editing","Videography","SEO","SEM"]
};

const $=id=>document.getElementById(id), C=CONFIG;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const root=document.documentElement;
let dark=!matchMedia('(prefers-color-scheme:light)').matches;
const setTheme=()=>root.dataset.theme=dark?'dark':'light';
setTheme();$('theme').onclick=()=>{dark=!dark;setTheme()};

document.title=C.name+" – "+C.role;
$('logo').textContent=C.name;$('headline').textContent=C.headline;$('tagline').textContent=C.tagline;
$('cta').textContent=C.contactHeading;$('mail').textContent=C.email;$('mail').href='mailto:'+C.email;
$('loc').textContent=C.location;$('li').href=C.linkedin;
if(C.github){$('gh').href=C.github;$('gh').hidden=false}
if(C.phone){$('ph').href='tel:'+C.phone;$('ph').hidden=false}
if(C.photo){$('photo').src=C.photo;$('photo').alt='Portrait of '+C.name;$('photo').hidden=false}
$('foot').textContent='© '+new Date().getFullYear()+' '+C.name;

const q=s=>JSON.stringify(s), arr=a=>JSON.stringify(a).replace(/","/g,'", "');
const seg=[
 ["const ","k"],["dinesh","n"],[" = {\n","m"],
 ["  name: ","m"],[q(C.name),"s"],[",\n","m"],
 ["  roles: ","m"],[arr(C.typedRoles),"s"],[",\n","m"],
 ["  stack: ","m"],[arr(C.typedStack),"s"],[",\n","m"],
 ["  openToWork: ","m"],[String(C.openToWork),"f"],[",\n","m"],
 ["  deliver() {\n","m"],["    return ","k"],[q(C.typedSkill),"s"],[";\n  }\n","m"],
 ["};\n\n","m"],["dinesh","n"],[".deliver()","f"],[";","m"]];

const code=$('code'),reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
const cur=document.createElement('span');cur.className='cur';

(function(){let i=0,j=0,el=null;code.appendChild(cur);
 (function step(){
  if(i>=seg.length)return;
  const[txt,c]=seg[i];
  if(j===0){el=document.createElement('span');el.className=c;code.insertBefore(el,cur)}
  if(reduce){el.textContent=txt;i++;j=0;return step()}
  el.textContent+=txt[j++];
  if(j>=txt.length){i++;j=0}
  setTimeout(step,txt[j-1]==='\n'?160:28);
 })();
})();

$('svc').innerHTML=C.services.map(s=>`<div><h3>${esc(s.title)}</h3><p>${esc(s.text)}</p></div>`).join('');
const pl=$('plist');
pl.innerHTML=C.projects.map((p,i)=>`<div class="proj" data-open="false"><button aria-expanded="false" aria-controls="m${i}"><div><h3>${esc(p.title)}</h3><span class="yr">${esc(p.label||p.year||'')}</span></div><span class="plus" aria-hidden="true"></span></button><div class="more" id="m${i}"><div><p>${esc(p.description)}</p><div class="tags">${p.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div><div class="links">${p.code?`<a href="${esc(p.code)}">Source code</a>`:''}${p.demo?`<a href="${esc(p.demo)}">Live demo</a>`:''}</div></div></div></div>`).join('');

pl.addEventListener('click',e=>{
 const b=e.target.closest('button');
 if(!b)return;
 const r=b.parentElement,o=r.dataset.open==='true';
 r.dataset.open=!o;
 b.setAttribute('aria-expanded',!o)
});

const first=pl.querySelector('.proj');
if(first){
 first.dataset.open='true';
 first.querySelector('button').setAttribute('aria-expanded','true')
}

$('edu').innerHTML=C.education.map(e=>`<div class="edu"><div><h3>${esc(e.title)}</h3><p>${esc(e.place)}</p></div><div class="when">${esc([e.period,e.detail].filter(Boolean).join(' · '))}</div></div>`).join('');

$('skills-grid').innerHTML=Object.entries(C.skills).map(([h,l])=>`<div><h3>${esc(h)}</h3><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`).join('');

const row=C.marquee.concat(C.marquee).map(x=>`<span>${esc(x)}</span>`).join('');
$('mq').innerHTML=row+row;

$('copy').onclick=async e=>{
 try{
  await navigator.clipboard.writeText(C.email);
  e.target.textContent='Copied'
 }catch(_){
  e.target.textContent='Copy failed'
 }
 setTimeout(()=>e.target.textContent='Copy email',1600)
};
</script>
</body>
</html>
